<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Voice Forge Studios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .account-wrap{max-width:760px;margin:0 auto;padding:48px 32px 80px;}
  .account-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
  .account-head h1{font-size:24px;font-weight:700;}
  .account-head h1 span{color:var(--orange);}
  .account-sub{color:var(--muted);font-size:13px;margin-top:4px;}

  .booking-row{
    background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px 20px;
    display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px;flex-wrap:wrap;
  }
  .booking-row .bk-main{font-family:'Oswald';font-size:14px;font-weight:600;}
  .booking-row .bk-sub{color:var(--muted);font-size:12px;margin-top:4px;}
  .booking-row .bk-id{color:var(--orange-2);font-family:'Oswald';font-size:12px;letter-spacing:0.04em;}
  .empty-state{
    text-align:center;color:var(--muted);font-size:13.5px;padding:50px 20px;
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
  }
  .empty-state i{font-size:28px;color:var(--muted-2);margin-bottom:12px;display:block;}
  #accountLoading{text-align:center;color:var(--muted);padding:40px 0;}
</style>
</head>
<body>

<header>
  <nav>
    <div class="logo">
      <div class="logo-mark"><i class="fa-solid fa-microphone"></i><span class="f">F</span></div>
      <div class="logo-text">
        <div class="l1">VOICE <span>FORGE</span></div>
        <div class="l2">STUDIOS</div>
      </div>
    </div>
    <div class="navlinks">
      <a href="/">HOME</a>
      <a href="/#reels">DEMO REELS <i class="fa-solid fa-chevron-down" style="font-size:9px;"></i></a>
      <a href="/portfolio">PORTFOLIO</a>
      <a href="/pricing">PRICING</a>
      <a href="/ai-voices">AI VOICES</a>
      <a href="/#book">BOOK SESSION</a>
      <a href="/about">ABOUT</a>
      <a href="/contact">CONTACT</a>
    </div>
    <div class="nav-right">
      <a class="btn btn-ghost" href="/login" id="navLoginBtn">LOGIN</a>
      <button class="btn btn-orange" onclick="openQuoteModal()">GET A QUOTE</button>
    </div>
  </nav>
</header>

<div class="account-wrap">
  <div id="accountLoading">Loading your account…</div>

  <div id="accountContent" style="display:none;">
    <div class="account-head">
      <div>
        <h1>MY <span>ACCOUNT</span></h1>
        <div class="account-sub" id="accountEmailLine"></div>
      </div>
      <button class="btn btn-outline" onclick="doLogout()"><i class="fa-solid fa-right-from-bracket"></i> LOG OUT</button>
    </div>

    <div class="section-head"><span class="label">YOUR BOOKINGS</span></div>
    <div id="bookingsList"></div>
  </div>
</div>

<footer>
  © 2026 <span>Voice Forge</span> Studios. Crafted for voices that command attention.
</footer>

<script src="account.js"></script>
<script src="quote.js"></script>
</body>
</html>
